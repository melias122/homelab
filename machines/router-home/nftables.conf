table inet filter {
  chain output {
    type filter hook output priority filter
    policy accept
    counter accept
  }

  chain input {
    type filter hook input priority filter
    policy drop

    ct state { established, related } counter accept
    ct state invalid counter drop

    ip protocol icmp icmp type {
      echo-request,
      destination-unreachable,
      time-exceeded,
      parameter-problem,
    } counter accept

    iifname { "lo", "tailscale0" } counter accept comment "Allow trusted interfaces to router"

    # LAN holds IoT, so not trusted wholesale: Blocky's :4000 API can disable
    # blocking and node-exporter :9100 is unauthenticated.
    iifname "eno1" udp dport { 53, 67, 41641 } counter accept comment "DNS, DHCP, tailscale direct"
    iifname "eno1" tcp dport { 22, 53 } counter accept comment "SSH, DNS"
    iifname "eno1" meta l4proto ipv6-icmp counter accept comment "IPv6 ND"
  }

  chain forward {
    type filter hook forward priority filter
    policy drop

    # PPPoE MTU
    oifname { "ppp0", "eno2" } tcp flags syn tcp option maxseg size set rt mtu

    # Cloud-connected cams stay off the internet.
    ip saddr 192.168.1.50-192.168.1.53 oifname { "ppp0", "eno2" } udp dport 123 counter accept comment "Cams NTP only"
    ip saddr 192.168.1.50-192.168.1.53 oifname { "ppp0", "eno2" } counter drop comment "Cams no WAN"

    iifname {
      "eno1",
    } oifname {
     "ppp0",
     "eno2",
    } counter accept comment "Allow trusted LAN to WAN"

    iifname "eno1" oifname "tailscale0" counter accept comment "Allow trusted LAN to Tailscale"

    iifname {
      "ppp0",
      "eno2",
    } oifname {
      "eno1",
    } ct state established,related counter accept comment "Allow established back to LANs"

    iifname "tailscale0" oifname "eno1" counter accept comment "Allow Tailscale to LAN"
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "ppp0" masquerade
    oifname "eno2" masquerade
  }
}
