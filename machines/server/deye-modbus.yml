        address: 300170
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: soc_percent, slot: "6" }
        address: 300171
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: charging, slot: "1" }  # 0 off, 1 grid, 2 generator, 3 both
        address: 300172
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: charging, slot: "2" }
        address: 300173
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: charging, slot: "3" }
        address: 300174
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: charging, slot: "4" }
        address: 300175
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: charging, slot: "5" }
