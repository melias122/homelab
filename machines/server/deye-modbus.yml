        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: time, slot: "5" }
        address: 300152
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: time, slot: "6" }
        address: 300153
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: power_watts, slot: "1" }
        address: 300154
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: power_watts, slot: "2" }
        address: 300155
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: power_watts, slot: "3" }
        address: 300156
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: power_watts, slot: "4" }
        address: 300157
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: power_watts, slot: "5" }
        address: 300158
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: power_watts, slot: "6" }
        address: 300159
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: soc_percent, slot: "1" }
        address: 300166
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: soc_percent, slot: "2" }
        address: 300167
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: soc_percent, slot: "3" }
        address: 300168
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
        labels: { setting: soc_percent, slot: "4" }
        address: 300169
        dataType: uint16
        metricType: gauge
      - name: deye_tou
        help: Time-of-use program setting per slot
